name: Deploy

on:
  push:
    branches: [main]

env:
  ACR: ${{ secrets.ACR_LOGIN_SERVER }}
  RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
  APP: ${{ secrets.CONTAINER_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Free runner disk before the Docker build. The hosted Ubuntu
      # image ships with the Android SDK pre-installed at
      # /usr/local/lib/android (~14 GB). We don't use it; building
      # our image (sentence-transformers + ChromaDB layers) was
      # running out of space in run #25202140993 with the SDK still
      # in place. Removing only this directory; everything else on
      # the runner stays as-is.
      - name: Free Android-SDK disk space (runner only)
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h /

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${ACR%%.*}

      - name: Build and push Docker image
        run: |
          docker build -t $ACR/aitutor:${{ github.sha }} -t $ACR/aitutor:latest .
          docker push $ACR/aitutor:${{ github.sha }}
          docker push $ACR/aitutor:latest

      - name: Set revision mode to single (auto-deactivate old revisions)
        run: |
          az containerapp revision set-mode \
            --name $APP \
            --resource-group $RG \
            --mode single

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name $APP \
            --resource-group $RG \
            --image $ACR/aitutor:${{ github.sha }}
