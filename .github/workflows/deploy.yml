name: Deploy

on:
  # Auto-deploy on merge to main. The active prompt + model are read
  # from repo variables (configured under Settings -> Secrets and
  # variables -> Actions -> Variables) so the PR reviewer can flip
  # them without editing this file. Empty values fall through to the
  # current production behaviour (baseline prompt + DB-active model).
  push:
    branches: [main]

  # Manual trigger for ad-hoc revisions (rollback, hotfix, prompt
  # variant flip without a code change). The dropdowns below are
  # surfaced in the GitHub Actions UI when the operator clicks
  # "Run workflow".
  workflow_dispatch:
    inputs:
      tutor_prompt_variant:
        description: 'Tutor prompt variant'
        required: false
        type: choice
        default: 'baseline'
        options:
          - baseline      # current production per-provider template
          - v6            # highest measured composite quality score
          - v7            # branch-template restructure (smaller, cleaner)
      tutor_model_override:
        description: 'Tutor model override (provider/model_name); leave blank to use DB-active'
        required: false
        type: choice
        default: ''
        options:
          - ''                                            # use DB-active config
          - 'anthropic/claude-sonnet-4-20250514'          # Sonnet 4 (standard)
          - 'anthropic/claude-sonnet-4-6'                 # Sonnet 4.6 (standard, newer)
          - 'anthropic/claude-opus-4-7'                   # Opus 4.7 (premium)
          - 'google/gemini-3-flash-preview'               # Flash (cheapest)
          - 'google/gemini-3.1-pro-preview'               # Pro (premium)
      skip_eval:
        description: 'Skip the post-deploy tutor evaluation (saves ~$5 and ~15 min)'
        required: false
        type: boolean
        default: false
      eval_matrix_mode:
        description: 'Eval matrix size when run: deploy=4 cells (1 model, ~$5), full=8 cells (~$15)'
        required: false
        type: choice
        default: 'deploy'
        options:
          - deploy
          - full

env:
  ACR: ${{ secrets.ACR_LOGIN_SERVER }}
  RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
  APP: ${{ secrets.CONTAINER_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Free runner disk before the Docker build. The hosted Ubuntu
      # image ships with the Android SDK pre-installed at
      # /usr/local/lib/android (~14 GB). We don't use it; building
      # our image (sentence-transformers + ChromaDB layers) was
      # running out of space in run #25202140993 with the SDK still
      # in place. Removing only this directory; everything else on
      # the runner stays as-is.
      - name: Free Android-SDK disk space (runner only)
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h /

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${ACR%%.*}

      - name: Build and push Docker image
        run: |
          docker build -t $ACR/aitutor:${{ github.sha }} -t $ACR/aitutor:latest .
          docker push $ACR/aitutor:${{ github.sha }}
          docker push $ACR/aitutor:latest

      - name: Set revision mode to single (auto-deactivate old revisions)
        run: |
          az containerapp revision set-mode \
            --name $APP \
            --resource-group $RG \
            --mode single

      # Resolve the prompt-variant + model-override values from
      # (1) workflow_dispatch inputs if present, else
      # (2) repo variables (`vars.TUTOR_PROMPT_VARIANT`,
      #     `vars.TUTOR_MODEL_OVERRIDE`), else
      # (3) defaults that preserve current production behaviour
      #     (baseline prompt, no model override).
      # Empty strings on either knob mean "use whatever's in the DB /
      # built-in" — set explicitly so `az containerapp update` does
      # not leave a stale value on the previous revision.
      - name: Resolve deploy-time config
        id: cfg
        run: |
          PROMPT_VARIANT="${{ github.event.inputs.tutor_prompt_variant || vars.TUTOR_PROMPT_VARIANT || 'baseline' }}"
          MODEL_OVERRIDE="${{ github.event.inputs.tutor_model_override || vars.TUTOR_MODEL_OVERRIDE || '' }}"
          echo "prompt_variant=$PROMPT_VARIANT" >> $GITHUB_OUTPUT
          echo "model_override=$MODEL_OVERRIDE" >> $GITHUB_OUTPUT
          echo "::notice title=Deploy config::TUTOR_PROMPT_VARIANT=$PROMPT_VARIANT  TUTOR_MODEL_OVERRIDE=$MODEL_OVERRIDE"

      - name: Deploy to Container App
        run: |
          # --set-env-vars writes the env vars onto the new revision.
          # Both knobs are always written (even when empty) so the new
          # revision does not inherit a stale value from a prior one.
          # Reading order in the app:
          #   * apps/tutoring/prompts/variants.py reads TUTOR_PROMPT_VARIANT
          #   * apps/llm/models.py::ModelConfig.get_for reads
          #     TUTOR_MODEL_OVERRIDE (purpose=tutoring only)
          az containerapp update \
            --name $APP \
            --resource-group $RG \
            --image $ACR/aitutor:${{ github.sha }} \
            --set-env-vars \
              "TUTOR_PROMPT_VARIANT=${{ steps.cfg.outputs.prompt_variant }}" \
              "TUTOR_MODEL_OVERRIDE=${{ steps.cfg.outputs.model_override }}"

  # ─────────────────────────────────────────────────────────────────
  # Post-deploy tutor evaluation
  # ─────────────────────────────────────────────────────────────────
  #
  # Runs after a successful deploy: spins up a fresh local SQLite,
  # loads a frozen curriculum fixture (L1137 math + L1425 geography),
  # drives the synthetic-student simulator against the tutor engine,
  # judges every transcript with Opus 4.7 against the 10-principle
  # Science-of-Learning rubric, and commits a markdown report to the
  # long-lived `eval-reports` branch under `runs/<sha>/`.
  #
  # `deploy` matrix mode = 1 model x 2 lessons x 2 personas = 4 cells.
  # `full` matrix mode = 2 models x 2 lessons x 2 personas = 8 cells.
  #
  # Pre-requisites (one-time setup before this job can run green):
  #   - Repo secrets ANTHROPIC_API_KEY, GOOGLE_API_KEY, OPENAI_API_KEY
  #   - `eval-fixtures/baseline.json` committed (regenerate with
  #     `python scripts/extract_eval_fixture.py`)
  #
  # Skip via workflow_dispatch input `skip_eval=true`.
  post_deploy_eval:
    name: Post-deploy tutor evaluation
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ success() && github.event.inputs.skip_eval != 'true' }}
    timeout-minutes: 30
    continue-on-error: true  # eval failures must not mark the deploy as failed
    permissions:
      contents: write  # push to the eval-reports branch
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      EVAL_MATRIX_MODE:  ${{ github.event.inputs.eval_matrix_mode || 'deploy' }}
      AB_REPORT_DIR:     /tmp/eval-out

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so the orphan-branch push works without
          # GitHub rejecting the first commit.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Migrate fresh local SQLite + seed eval data
        run: |
          python manage.py migrate --no-input
          python manage.py loaddata eval-fixtures/baseline.json
          python scripts/seed_eval_modelconfig.py

      - name: Run simulator (matrix mode = ${{ env.EVAL_MATRIX_MODE }})
        run: python scripts/run_ab_test.py

      - name: Run Opus 4.7 judge
        run: python scripts/judge_transcripts.py

      - name: Generate aggregate report
        run: python scripts/generate_reports.py

      - name: Commit report to eval-reports branch
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REL_DIR="runs/${SHA}-${EVAL_MATRIX_MODE}"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          # Switch to (or create) the eval-reports branch. The branch
          # is long-lived and has no protection so CI can push directly.
          if git ls-remote --exit-code --heads origin eval-reports >/dev/null 2>&1; then
            git fetch origin eval-reports
            git checkout -B eval-reports origin/eval-reports
          else
            git checkout --orphan eval-reports
            git rm -rf . >/dev/null 2>&1 || true
            cat <<'README' > README.md
          # Eval reports — CI-generated tutor evaluations

          Each commit on this branch is a tutor evaluation run captured by
          `.github/workflows/deploy.yml::post_deploy_eval`. The run is
          identified by the commit SHA of the main-branch deploy that
          triggered it plus the matrix mode.

          Layout:

              runs/<sha>-<mode>/
              ├── FINAL_REPORT.md      ← ranked prompt-edit recommendations
              ├── summary.md           ← per-cell + per-principle tables
              ├── cell_results.jsonl   ← raw programmatic metrics
              ├── cost_latency.md
              ├── per_cell/            ← full transcripts + judge evidence
              └── judge_scores/        ← structured judge output

          Run manually: GitHub Actions -> Deploy -> Run workflow
          (uncheck `skip_eval`, optionally set `eval_matrix_mode=full`).

          Companion human-written reviews live on `main` under
          `eval-reports/`.
          README
            git add README.md
            git commit -m "[post-deploy-eval] init eval-reports branch"
          fi

          mkdir -p "$REL_DIR"
          cp -r "$AB_REPORT_DIR"/* "$REL_DIR"/

          git add "$REL_DIR"
          if git diff --staged --quiet; then
            echo "::notice title=No eval changes::Nothing to commit"
          else
            git commit -m "[post-deploy-eval] ${SHA} mode=${EVAL_MATRIX_MODE}"
            git push -u origin eval-reports
            echo "::notice title=Eval report committed::eval-reports branch ${REL_DIR}"
          fi
