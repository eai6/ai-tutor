name: Deploy

on:
  # Auto-deploy on merge to main. The active prompt + model are read
  # from repo variables (configured under Settings -> Secrets and
  # variables -> Actions -> Variables) so the PR reviewer can flip
  # them without editing this file. Empty values fall through to the
  # current production behaviour (baseline prompt + DB-active model).
  push:
    branches: [main]

  # Manual trigger for ad-hoc revisions (rollback, hotfix, prompt
  # variant flip without a code change). The dropdowns below are
  # surfaced in the GitHub Actions UI when the operator clicks
  # "Run workflow".
  workflow_dispatch:
    inputs:
      # Per-purpose model overrides for the v2 engine (Phase 3 §3.6.1).
      # Each overrides the DB-active ModelConfig row for that purpose.
      # Format: 'provider/model_name'. Empty = use DB-active.
      # GRADER_GROUNDED + TUTOR_CLAIM_ADJUDICATOR are Gemini-only
      # (Google-grounding is provider-required) — the workflow logs a
      # warning if a non-Gemini value is supplied.
      tutor_move_model_override:
        description: 'TUTOR_MOVE override (provider/model_name); blank = DB-active'
        required: false
        type: string
        default: ''
      grader_math_model_override:
        description: 'GRADER_MATH override (provider/model_name); blank = DB-active'
        required: false
        type: string
        default: ''
      grader_grounded_model_override:
        description: 'GRADER_GROUNDED override — Gemini-only; blank = DB-active'
        required: false
        type: string
        default: ''
      conformance_classifier_model_override:
        description: 'CONFORMANCE_CLASSIFIER override (provider/model_name); blank = DB-active'
        required: false
        type: string
        default: ''
      tutor_claim_adjudicator_model_override:
        description: 'TUTOR_CLAIM_ADJUDICATOR override — Gemini-only; blank = DB-active'
        required: false
        type: string
        default: ''
      profiler_summary_model_override:
        description: 'PROFILER_SUMMARY override (provider/model_name); blank = DB-active'
        required: false
        type: string
        default: ''
      new_tutor:
        description: 'NEW_TUTOR routing (default on; off = kill switch for safety incidents only)'
        required: false
        type: choice
        default: 'on'
        options:
          - 'on'
          - 'off'
      skip_eval:
        description: 'Skip the post-deploy tutor evaluation (saves ~$5 and ~15 min)'
        required: false
        type: boolean
        default: false
      eval_matrix_mode:
        description: 'Eval matrix size: deploy=4 cells (Sonnet+Gemini × 2 lessons × error_prone, ~$15, ~25 min) · full=24 cells (Sonnet+Gemini × 4 lessons × all 3 personas, ~$60, ~100 min)'
        required: false
        type: choice
        default: 'deploy'
        options:
          - deploy
          - full
      run_pgvector_port:
        description: 'Run one-time ChromaDB→pgvector port + KB coverage audit after deploy (use after the PR #11 migration lands on this stack)'
        required: false
        type: boolean
        default: false

env:
  ACR: ${{ secrets.ACR_LOGIN_SERVER }}
  RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
  APP: ${{ secrets.CONTAINER_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Free runner disk before the Docker build. The hosted Ubuntu
      # image ships with the Android SDK pre-installed at
      # /usr/local/lib/android (~14 GB). We don't use it; building
      # our image (sentence-transformers + ChromaDB layers) was
      # running out of space in run #25202140993 with the SDK still
      # in place. Removing only this directory; everything else on
      # the runner stays as-is.
      - name: Free Android-SDK disk space (runner only)
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h /

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${ACR%%.*}

      - name: Build and push Docker image
        run: |
          docker build -t $ACR/aitutor:${{ github.sha }} -t $ACR/aitutor:latest .
          docker push $ACR/aitutor:${{ github.sha }}
          docker push $ACR/aitutor:latest

      - name: Set revision mode to single (auto-deactivate old revisions)
        run: |
          az containerapp revision set-mode \
            --name $APP \
            --resource-group $RG \
            --mode single

      # Resolve the v2 per-purpose model overrides + NEW_TUTOR kill
      # switch from (1) workflow_dispatch inputs, else (2) repo
      # variables, else (3) defaults. Empty strings mean "use the
      # DB-active config for that purpose" — set explicitly so
      # `az containerapp update` does not inherit a stale value.
      # Phase 3 §3.6.1 replaces the single TUTOR_MODEL_OVERRIDE with
      # six per-purpose overrides (one per v2 ModelConfig.Purpose).
      - name: Resolve deploy-time config
        id: cfg
        run: |
          TUTOR_MOVE="${{ github.event.inputs.tutor_move_model_override || vars.TUTOR_MOVE_MODEL_OVERRIDE || '' }}"
          GRADER_MATH="${{ github.event.inputs.grader_math_model_override || vars.GRADER_MATH_MODEL_OVERRIDE || '' }}"
          GRADER_GROUNDED="${{ github.event.inputs.grader_grounded_model_override || vars.GRADER_GROUNDED_MODEL_OVERRIDE || '' }}"
          CONFORMANCE="${{ github.event.inputs.conformance_classifier_model_override || vars.CONFORMANCE_CLASSIFIER_MODEL_OVERRIDE || '' }}"
          TUTOR_CLAIM="${{ github.event.inputs.tutor_claim_adjudicator_model_override || vars.TUTOR_CLAIM_ADJUDICATOR_MODEL_OVERRIDE || '' }}"
          PROFILER="${{ github.event.inputs.profiler_summary_model_override || vars.PROFILER_SUMMARY_MODEL_OVERRIDE || '' }}"
          NEW_TUTOR="${{ github.event.inputs.new_tutor || vars.NEW_TUTOR || 'on' }}"

          # Gemini-only guard for the grounded purposes (warn but do
          # not block — the runtime ModelConfig.get_for fail-soft will
          # fall through to DB-active if the override is invalid).
          for v in "$GRADER_GROUNDED" "$TUTOR_CLAIM"; do
            if [[ -n "$v" && ! "$v" =~ ^google/ ]]; then
              echo "::warning title=Non-Gemini override on grounded purpose::$v — Google-grounding requires a Gemini provider; runtime will fall through to DB-active."
            fi
          done

          {
            echo "tutor_move=$TUTOR_MOVE"
            echo "grader_math=$GRADER_MATH"
            echo "grader_grounded=$GRADER_GROUNDED"
            echo "conformance=$CONFORMANCE"
            echo "tutor_claim=$TUTOR_CLAIM"
            echo "profiler=$PROFILER"
            echo "new_tutor=$NEW_TUTOR"
          } >> $GITHUB_OUTPUT

          echo "::notice title=Deploy config::NEW_TUTOR=$NEW_TUTOR  TUTOR_MOVE=$TUTOR_MOVE  GRADER_MATH=$GRADER_MATH  GRADER_GROUNDED=$GRADER_GROUNDED  CONFORMANCE_CLASSIFIER=$CONFORMANCE  TUTOR_CLAIM_ADJUDICATOR=$TUTOR_CLAIM  PROFILER_SUMMARY=$PROFILER"

      - name: Deploy to Container App
        run: |
          # --set-env-vars writes the env vars onto the new revision.
          # All knobs are always written (even when empty) so the new
          # revision does not inherit a stale value from a prior one.
          # Reading order in the app:
          #   * apps/tutoring/v2/config/flags.py reads NEW_TUTOR
          #   * apps/llm/models.py::ModelConfig.get_for reads each
          #     per-purpose override
          az containerapp update \
            --name $APP \
            --resource-group $RG \
            --image $ACR/aitutor:${{ github.sha }} \
            --set-env-vars \
              "NEW_TUTOR=${{ steps.cfg.outputs.new_tutor }}" \
              "TUTOR_MOVE_MODEL_OVERRIDE=${{ steps.cfg.outputs.tutor_move }}" \
              "GRADER_MATH_MODEL_OVERRIDE=${{ steps.cfg.outputs.grader_math }}" \
              "GRADER_GROUNDED_MODEL_OVERRIDE=${{ steps.cfg.outputs.grader_grounded }}" \
              "CONFORMANCE_CLASSIFIER_MODEL_OVERRIDE=${{ steps.cfg.outputs.conformance }}" \
              "TUTOR_CLAIM_ADJUDICATOR_MODEL_OVERRIDE=${{ steps.cfg.outputs.tutor_claim }}" \
              "PROFILER_SUMMARY_MODEL_OVERRIDE=${{ steps.cfg.outputs.profiler }}"

      - name: Log resolved per-purpose models at boot
        run: |
          echo "::notice title=Per-purpose dispatch::Resolved at app boot via ModelConfig.get_for(purpose); see logs for runtime values."

  # ─────────────────────────────────────────────────────────────────
  # Post-deploy tutor evaluation
  # ─────────────────────────────────────────────────────────────────
  #
  # Runs after a successful deploy: spins up a fresh local SQLite,
  # loads a frozen curriculum fixture (L1137 math + L1425 geography),
  # drives the synthetic-student simulator against the tutor engine,
  # judges every transcript with Opus 4.7 against the 10-principle
  # Science-of-Learning rubric, and commits a markdown report to the
  # long-lived `eval-reports` branch under `runs/<sha>/`.
  #
  # `deploy` matrix mode (default): {Sonnet 4, Gemini 3 Flash} × 2
  #   lessons (1 math + 1 geo) × `error_prone` persona = 4 cells,
  #   ~25 min, ~$15/run. Optimised for BEA signal per dollar:
  #   error_prone produces 12-17 BEA in-scope turns per cell where
  #   struggler/capable gave only 0-3. Both prod-tier models so we
  #   catch cross-model regressions on every deploy.
  # `full` matrix mode (ad-hoc): 2 models × 4 lessons × 3 personas
  #   = 24 cells, ~100 min, ~$60. Use for comprehensive sweeps when
  #   making a prompt-variant decision.
  #
  # Pre-requisites (one-time setup before this job can run green):
  #   - Repo secrets ANTHROPIC_API_KEY, GOOGLE_API_KEY, OPENAI_API_KEY
  #   - `eval-fixtures/baseline.json` committed (regenerate with
  #     `python scripts/extract_eval_fixture.py`)
  #
  # Skip via workflow_dispatch input `skip_eval=true`.
  post_deploy_eval:
    name: Post-deploy tutor evaluation
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ success() && github.event.inputs.skip_eval != 'true' }}
    timeout-minutes: 60  # 4-cell deploy matrix runs ~25 min sim + ~10 min judge; Gemini error_prone cells hit ~10 min each
    continue-on-error: true  # eval failures must not mark the deploy as failed
    permissions:
      contents: write  # push to the eval-reports branch
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      EVAL_MATRIX_MODE:  ${{ github.event.inputs.eval_matrix_mode || 'deploy' }}
      AB_REPORT_DIR:     /tmp/eval-out

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so the orphan-branch push works without
          # GitHub rejecting the first commit.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # Match Dockerfile (python:3.12-slim) — requirements.txt pins
          # Django 6.0.2 which requires Python >= 3.12.
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Migrate fresh local SQLite + seed eval data
        run: |
          python manage.py migrate --no-input
          python manage.py loaddata eval-fixtures/baseline.json
          python scripts/seed_eval_modelconfig.py

      - name: Run simulator (matrix mode = ${{ env.EVAL_MATRIX_MODE }})
        run: python scripts/run_ab_test.py

      - name: Run Opus 4.7 judge
        run: python scripts/judge_transcripts.py

      - name: Generate aggregate report
        run: python scripts/generate_reports.py

      - name: Commit report to eval-reports branch
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REL_DIR="runs/${SHA}-${EVAL_MATRIX_MODE}"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          # Switch to (or create) the eval-reports branch. The branch
          # is long-lived and has no protection so CI can push directly.
          if git ls-remote --exit-code --heads origin eval-reports >/dev/null 2>&1; then
            git fetch origin eval-reports
            git checkout -B eval-reports origin/eval-reports
          else
            git checkout --orphan eval-reports
            git rm -rf . >/dev/null 2>&1 || true
            cat <<'README' > README.md
          # Eval reports — CI-generated tutor evaluations

          Each commit on this branch is a tutor evaluation run captured by
          `.github/workflows/deploy.yml::post_deploy_eval`. The run is
          identified by the commit SHA of the main-branch deploy that
          triggered it plus the matrix mode.

          Layout:

              runs/<sha>-<mode>/
              ├── FINAL_REPORT.md      ← ranked prompt-edit recommendations
              ├── summary.md           ← per-cell + per-principle tables
              ├── cell_results.jsonl   ← raw programmatic metrics
              ├── cost_latency.md
              ├── per_cell/            ← full transcripts + judge evidence
              └── judge_scores/        ← structured judge output

          Run manually: GitHub Actions -> Deploy -> Run workflow
          (uncheck `skip_eval`, optionally set `eval_matrix_mode=full`).

          Companion human-written reviews live on `main` under
          `eval-reports/`.
          README
            git add README.md
            git commit -m "[post-deploy-eval] init eval-reports branch"
          fi

          mkdir -p "$REL_DIR"
          cp -r "$AB_REPORT_DIR"/* "$REL_DIR"/

          git add "$REL_DIR"
          if git diff --staged --quiet; then
            echo "::notice title=No eval changes::Nothing to commit"
          else
            git commit -m "[post-deploy-eval] ${SHA} mode=${EVAL_MATRIX_MODE}"
            git push -u origin eval-reports
            echo "::notice title=Eval report committed::eval-reports branch ${REL_DIR}"
          fi

  # ─────────────────────────────────────────────────────────────────
  # One-time ChromaDB → pgvector port + KB coverage audit
  # ─────────────────────────────────────────────────────────────────
  #
  # OPT-IN. Set `run_pgvector_port=true` on a workflow_dispatch run,
  # AFTER the PR #11 (pgvector) deploy has rolled out cleanly on
  # this stack. Idempotent — re-running is safe (existing chunks
  # are upserted, count reports 0 new + N updated).
  #
  # Why this job runs on the runner (not in the deployed container):
  #   - `az containerapp exec` requires interactive TTY → unusable in CI
  #   - `chromadb` was deliberately dropped from requirements.txt in
  #     Phase 7; we don't want to put it back permanently
  #   - The runner can pip-install chromadb just for this one job,
  #     download vectordb from the share via azcopy, and connect
  #     directly to the target Postgres
  #
  # Pre-requisites:
  #   - Repo secrets: PROD_DB_PASSWORD (the Pulumi-managed db-password
  #     for this stack — see infra/Pulumi.pixel.yaml)
  #   - AZURE_CREDENTIALS already grants the SP Contributor on the RG
  post_deploy_pgvector_port:
    name: Post-deploy ChromaDB → pgvector port + audit
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ success() && github.event.inputs.run_pgvector_port == 'true' }}
    timeout-minutes: 30
    env:
      PG_SERVER: aitutor-pixel-pg
      PG_FQDN: aitutor-pixel-pg.postgres.database.azure.com
      STORAGE_ACCOUNT: aitutorpixelsa
      DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps + chromadb (CI-only, transitional)
        run: |
          pip install -r requirements.txt
          pip install chromadb==1.5.0

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install azcopy
        run: |
          curl -L https://aka.ms/downloadazcopy-v10-linux -o /tmp/azcopy.tgz
          tar -xzf /tmp/azcopy.tgz -C /tmp
          sudo mv /tmp/azcopy_linux_amd64_*/azcopy /usr/local/bin/azcopy
          azcopy --version

      - name: Open Postgres firewall to runner
        id: fw
        run: |
          IP=$(curl -sS https://api.ipify.org)
          RULE="ci-pgvector-port-${{ github.run_id }}"
          echo "ip=$IP" >> $GITHUB_OUTPUT
          echo "rule=$RULE" >> $GITHUB_OUTPUT
          az postgres flexible-server firewall-rule create \
            --resource-group $RG \
            --name $PG_SERVER \
            --rule-name "$RULE" \
            --start-ip-address $IP --end-ip-address $IP \
            -o none

      - name: Download vectordb snapshot from share
        run: |
          KEY=$(az storage account keys list \
            --account-name $STORAGE_ACCOUNT --resource-group $RG \
            --query '[0].value' -o tsv)
          EXPIRY=$(date -u -d "+2 hour" +"%Y-%m-%dT%H:%MZ")
          SAS=$(az storage share generate-sas \
            --name media --account-name $STORAGE_ACCOUNT --account-key "$KEY" \
            --permissions rl --expiry "$EXPIRY" -o tsv)
          azcopy copy \
            "https://${STORAGE_ACCOUNT}.file.core.windows.net/media/vectordb?${SAS}" \
            ./vectordb_snapshot \
            --recursive --log-level=ERROR
          du -sh ./vectordb_snapshot

      - name: Run port + audit
        env:
          DATABASE_URL: postgres://aitutoradmin:${{ env.DB_PASSWORD }}@${{ env.PG_FQDN }}:5432/aitutor?sslmode=require
          SECRET_KEY: ci-port-job-not-secret
          DEBUG: 'False'
          ALLOWED_HOSTS: '*'
          EMBEDDING_BACKEND: local
        run: |
          set -euo pipefail
          echo "::group::ChromaDB → pgvector port"
          python manage.py port_chromadb_to_pgvector --vectordb-path ./vectordb_snapshot/vectordb
          echo "::endgroup::"
          echo "::group::KB coverage audit"
          python manage.py audit_kb_coverage
          echo "::endgroup::"

      - name: Close Postgres firewall
        if: always() && steps.fw.outputs.rule != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group $RG \
            --name $PG_SERVER \
            --rule-name "${{ steps.fw.outputs.rule }}" \
            --yes -o none || true
