name: Desktop app (Windows / macOS)

# Builds the offline desktop tutor for all three platforms.
#
# Additive: this workflow does not touch the Azure deploy pipeline in
# deploy.yml / deploy-staging.yml. It builds artifacts and uploads them; it
# never deploys anything.
#
# Manual by default. Desktop builds are slow (~15-25 min each) and produce
# ~500 MB of artifacts per platform, so they should not run on every push to
# a branch that only changes server code. Tag pushes (v*) also build, which is
# how a release is cut.
#
# Why a matrix and not one job: everything platform-specific here genuinely
# cannot be cross-built.
#   - PyInstaller does not cross-compile. A macOS .app must be built on macOS.
#   - Ollama is a native binary, staged per-platform by `manage.py stage_ollama`.
#   - pywebview binds the platform's own webview: WKWebView (macOS),
#     WebView2 (Windows). Linux was dropped 2026-08-08 — the pilot machines are
#     Windows and macOS, and the GTK/WebKitGTK path cost a runner-disk workaround
#     and a PyGObject pin for a target nobody was installing on.
#
# What the build does NOT include, by design:
#   - The 2.5 GB tutor model. Installers stay ~150-250 MB; the app acquires the
#     model after install from a USB file or a download. See
#     memory/desktop_offline_app_plan.md (decision D1).
#   - Code signing / notarisation. Unsigned builds are blocked by Gatekeeper
#     and SmartScreen, so these artifacts are for internal testing until
#     certificates exist. Tracked in the plan under Risks.
#
# Plan: memory/desktop_offline_app_plan.md

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build'
        type: choice
        default: 'all'
        options: [all, macos, windows]
  push:
    # `desktop-v*`, NOT `v*`. deploy.yml triggers on `v[0-9]+.[0-9]+.[0-9]+`,
    # so a plain `v*` pattern here would overlap it: tagging v0.1.0 to cut a
    # desktop build would also deploy to production. The desktop app and the
    # server are released on separate cadences anyway — the app is installed
    # by hand on classroom machines, the server ships continuously.
    tags: ['desktop-v*']

permissions:
  # `contents: write` creates the GitHub Release; `id-token: write` is the OIDC
  # handshake that gets us into AWS without a stored access key.
  contents: write
  id-token: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing should not cancel the others — a Windows
      # packaging problem says nothing about whether the macOS build is sound.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            slug: macos-arm64
            selector: macos
          - os: windows-latest
            label: Windows (x64)
            slug: windows-x64
            selector: windows

    steps:
      - uses: actions/checkout@v4

      - name: Skip unselected platform
        id: gate
        shell: bash
        run: |
          want='${{ github.event.inputs.platforms || 'all' }}'
          if [ "$want" = "all" ] || [ "$want" = "${{ matrix.selector }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.label }} (requested: $want)"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install -r requirements-desktop.txt
          # torch + onnx are build-only: needed to EXPORT the encoder, never to
          # run it. The spec excludes them from the bundle.
          pip install -r requirements-ml.txt -r requirements-build.txt
          #

      # Deterministic: exported from the same weights the parity test pins,
      # so every platform ships an identical encoder.
      - name: Export the ONNX encoder
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: python scripts/export_minilm_onnx.py

      # Ollama is a native binary and cannot be cross-copied, so each runner
      # installs it and stages its own. This is what makes the installed app
      # independent of any system Ollama on the target machine.
      # macOS needs different treatment from Windows. ollama.com/install.sh on
      # macOS installs Ollama.app into /Applications and then tries to LAUNCH
      # it, which on a headless runner dies with "Unable to find application
      # named 'Ollama'" and exits 1. Homebrew is preinstalled on the macOS
      # runners and yields the plain CLI binary, which is all `stage_ollama`
      # needs.
      - name: Install + stage Ollama (macOS)
        if: steps.gate.outputs.run == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          brew install ollama
          python manage.py stage_ollama --force

      # Windows has no installer script worth using here — download the release
      # zip and stage the binary directly.
      - name: Install + stage Ollama (Windows)
        if: steps.gate.outputs.run == 'true' && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $url = 'https://ollama.com/download/ollama-windows-amd64.zip'
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ollama-win.zip -UseBasicParsing
          Expand-Archive -Path ollama-win.zip -DestinationPath ollama-win -Force
          $exe = Get-ChildItem -Path ollama-win -Filter ollama.exe -Recurse |
                 Select-Object -First 1
          if (-not $exe) { throw "ollama.exe not found in the downloaded archive" }
          Write-Host "found $($exe.FullName)"
          python manage.py stage_ollama --from "$($exe.FullName)" --force

      # Fail the build if the two things that make it work offline are absent,
      # rather than shipping an installer that cannot tutor. The spec only
      # prints a warning, which is easy to miss in CI logs.
      - name: Verify offline payload is present
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          test -f models/minilm-l6-v2/model.onnx || { echo "::error::ONNX encoder missing"; exit 1; }
          # Check the two names separately. `ls a b` exits non-zero when EITHER
          # argument is missing, so listing both in one call always failed:
          # ollama.exe never exists on macOS/Linux and ollama never exists on
          # Windows. That reported "vendored Ollama binary missing" against a
          # correctly staged binary.
          if ls vendor/ollama/*/ollama >/dev/null 2>&1 \
             || ls vendor/ollama/*/ollama.exe >/dev/null 2>&1; then
            echo "engine: $(ls vendor/ollama/*/ollama* | head -1)"
          else
            echo "::error::vendored Ollama binary missing"; exit 1
          fi
          echo "payload OK"

      - name: Build with PyInstaller
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-dev' }}
        run: pyinstaller AI-Tutor.spec --noconfirm --log-level WARN

      # The smoke test must actually SERVE A PAGE, not just report status.
      #
      # Learned the hard way on 2026-07-30: the first build of this spec exited
      # 0, booted Django, ran migrations, loaded the ONNX encoder and reported
      # every check — then died inside collectstatic on
      # `ModuleNotFoundError: whitenoise.storage`, because settings names that
      # backend by string and hidden-importing the top-level package collects
      # only __init__. `--probe` returns BEFORE first-run setup, so a
      # probe-only smoke test passes a build that cannot serve a single page.
      # Requesting real HTML is the check that would have caught it.
      - name: Smoke-test the frozen binary
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            BIN="dist/AI Tutor.app/Contents/MacOS/AI-Tutor"
          else
            BIN="dist/AI-Tutor/AI-Tutor.exe"
          fi
          echo "serving from: $BIN"
          "$BIN" --serve --port 8799 > serve.log 2>&1 &
          SERVER_PID=$!

          for i in $(seq 1 60); do
            if curl -fsS -o page.html "http://127.0.0.1:8799/student/login/" 2>/dev/null; then
              echo "served a page after ${i}s"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::frozen server exited during startup"
              cat serve.log; exit 1
            fi
            sleep 1
          done

          if ! grep -q "AI Tutor" page.html 2>/dev/null; then
            echo "::error::frozen binary never served the login page"
            cat serve.log; exit 1
          fi

          # Startup must be clean, not merely survivable — a swallowed
          # ModuleNotFoundError here means a broken feature later.
          if grep -qE "Traceback|ModuleNotFoundError" serve.log; then
            echo "::error::traceback during frozen startup"
            cat serve.log; exit 1
          fi

          curl -fsS "http://127.0.0.1:8799/desktop/health/" | tee health.json
          kill "$SERVER_PID" 2>/dev/null || true
          echo "frozen binary serves pages with a clean startup"

      - name: Package (macOS DMG)
        if: steps.gate.outputs.run == 'true' && runner.os == 'macOS'
        run: |
          hdiutil create -volname "AI Tutor" -srcfolder "dist/AI Tutor.app" \
            -ov -format UDZO "dist/AI-Tutor-${{ matrix.slug }}.dmg"
      - name: Package (Windows zip)
        if: steps.gate.outputs.run == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\AI-Tutor\* -DestinationPath "dist\AI-Tutor-${{ matrix.slug }}.zip"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: AI-Tutor-${{ matrix.slug }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

      # ── Publish ──────────────────────────────────────────────────────────
      # Two destinations, on purpose.
      #
      # S3 is how people actually download this. The repo is PRIVATE, so a
      # GitHub Release only reaches accounts with repo access — which is not
      # the audience. The bucket's public/ prefix is world-readable.
      #
      # The Release is the internal record: which commit produced which
      # installer. Nobody outside the repo needs to see it.
      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/desktop-v')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload the installer to the public download bucket
        if: steps.gate.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          BUCKET: ${{ secrets.AWS_DOWNLOADS_BUCKET }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          FILE=$(ls dist/AI-Tutor-${{ matrix.slug }}.* | head -1)
          echo "publishing $FILE for $TAG"
          # Versioned copy is the archive; latest/ is the link we hand out, so
          # the download page never needs editing when a new build ships.
          aws s3 cp "$FILE" "s3://${BUCKET}/public/desktop/releases/${TAG}/$(basename "$FILE")"
          aws s3 cp "$FILE" "s3://${BUCKET}/public/desktop/latest/$(basename "$FILE")" \
            --cache-control 'no-cache, max-age=60'

      - name: Add to the GitHub Release
        if: steps.gate.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          # This job builds ONE platform, so glob its own artifact. Listing
          # both dist/*.dmg and dist/*.zip failed the macOS job on the zip and
          # would have failed Windows on the dmg — each job only ever produces
          # one of them. Both jobs append to the same release.
          files: dist/AI-Tutor-${{ matrix.slug }}.*
          # Kept strict on purpose: an empty match here means the packaging
          # step silently produced nothing, which is worth failing on.
          fail_on_unmatched_files: true
          generate_release_notes: true
