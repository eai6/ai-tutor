config:
  azure-native:location: centralus
  azure-native:subscriptionId: 656f4091-746b-44ef-8add-6d94eb4a7612
  # ── Sizing knobs (override prod defaults for cheaper staging) ─────────
  # Consumption profile = serverless. min-replicas: 1 keeps one
  # container always warm so testers don't hit the 10-15s cold start
  # mid-flow (sentence-transformers + vectordb warm-up). The visible
  # symptom was exit-ticket submits feeling broken — 1.5s of actual
  # work hidden under 10s of cold-start spin-up. Cost trade-off: ~$3-5/
  # month for the always-on container vs UX-debugging time it saves.
  # Azure doesn't offer a D2 dedicated profile — only D4/D8/D16/D32 —
  # so Consumption is the cheapest smaller-than-prod option.
  aitutor:workload-profile-type: Consumption
  aitutor:container-cpu: "2.0"
  aitutor:container-memory: 4Gi
  aitutor:min-replicas: "1"
  aitutor:max-replicas: "1"
  aitutor:file-share-quota-gb: "20"
  aitutor:postgres-sku: Standard_B1ms
  aitutor:postgres-storage-gb: "32"
  # Staging doesn't need to handle big textbook OCR — set to 0 to skip
  # provisioning the material-processor Job entirely. Bump to 2.0 if
  # you want full parity with prod's upload pipeline.
  aitutor:material-job-cpu: "0"
  # ── Engine flags (staging only — prod stays on legacy CT for now) ────
  # Without these baked into Pulumi state, manual `az containerapp
  # update --set-env-vars SIMPLE_TUTOR_ENGINE=on …` gets silently
  # wiped on the next `pulumi up`. M12 rollout hit this 2026-05-27.
  aitutor:simple-tutor-engine: "on"
  aitutor:exit-ticket-types: "mcq"
  aitutor:exit-ticket-max-questions: "10"
  # MCQ-only tutoring (2026-05-28). Set after a staging E2E showed
  # short_answer questions accumulating `partial` verdicts that never
  # triggered step advance. MCQ verdicts are deterministic
  # (`correct` / `incorrect` via letter match), so the engine's
  # auto-advance fires cleanly. To loosen, set
  # 'mcq,short_numeric,short_answer'.
  aitutor:tutoring-question-types: "mcq"
  # ── Secrets — set via CLI on the staging stack ──────────────────────
  # Run from infra/:
  #   pulumi stack select staging
  #   pulumi config set --secret aitutor:db-password "$(openssl rand -base64 24)"
  #   pulumi config set --secret aitutor:django-secret-key "$(python -c 'import secrets;print(secrets.token_urlsafe(50))')"
  #   pulumi config set --secret aitutor:anthropic-api-key "<reuse prod key>"
  #   pulumi config set --secret aitutor:openai-api-key    "<reuse prod key>"
  #   pulumi config set --secret aitutor:google-api-key    "<reuse prod key>"
  #   pulumi config set --secret aitutor:elevenlabs-api-key "<reuse prod key>"
  #
  # The DB password + Django secret key MUST differ from prod (defense
  # in depth — staging dump exposure must not leak prod creds). The
  # LLM API keys can be the same as prod since they're read-only calls
  # to the providers; cheaper than maintaining separate keys + budgets.

  # Staging custom domain — added 2026-06-01 per Edward. DNS records
  # set at the seselai.sc registrar:
  #   asuid.staging.seselai.sc  TXT    F7F1120D...A2585  (env verificationId)
  #   staging.seselai.sc        CNAME  aitutor-staging-app.icyplant-cffb8b76.centralus.azurecontainerapps.io
  # The Pulumi ManagedCertificate validates against asuid TXT, then
  # CustomDomain binding attaches the cert to the Container App.
  # CSRF_TRUSTED_ORIGINS auto-updated from this list via infra/__main__.py.
  aitutor:custom-domains:
    - staging.seselai.sc
  # Staging skips the ACS Email auto-provision (added 2026-06-01).
  # Transactional mail isn't needed for staging QA; the Container App
  # falls back to the console email backend (django prints to stdout).
  # If you ever want real email on staging, flip to true and add the
  # email DNS records at the seselai.sc registrar (5 records — Domain
  # TXT, SPF, DKIM, DKIM2, DMARC).
  aitutor:email-enabled: "false"
