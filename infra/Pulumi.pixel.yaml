  # Engine flags (added 2026-05-29 with v0.1.0 release). Without these
  # baked into Pulumi state, the manual
  #   az containerapp update --set-env-vars SIMPLE_TUTOR_ENGINE=on ...
  # gets silently wiped on the next `pulumi up`. M12 staging rollout
  # hit this same failure 2026-05-27.
  aitutor:simple-tutor-engine: "on"
  aitutor:tutoring-question-types: "mcq"
  aitutor:exit-ticket-types: "mcq"
  aitutor:exit-ticket-max-questions: "10"
