{% load dashboard_ui %}
<div class="empty">
    {% icon icon_name %}
    <p class="empty__title">{{ title }}</p>
    {% if body %}<p class="empty__body">{{ body }}</p>{% endif %}
    {% if action_url and action_label %}
    <a href="{{ action_url }}" class="btn btn--secondary btn--sm">{{ action_label }}</a>
    {% endif %}
</div>
