{% extends 'base.html' %}
{% block title %}Reset Link Sent - AI Tutor{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card card animate-in">
        <div class="auth-header">
            <div class="auth-icon">📧</div>
            <h1>Check Your Email</h1>
            <p class="text-muted">If an account exists with that email, we've sent a password reset link. Check your inbox (and spam folder).</p>
        </div>
        <div class="auth-footer">
            <p><a href="{% url 'accounts:student_login' %}">Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
