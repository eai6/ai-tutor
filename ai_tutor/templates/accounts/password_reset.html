{% extends 'base.html' %}
{% load dashboard_ui %}
{% block title %}Reset Password - AI Tutor{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card card animate-in bg-surface border border-border rounded-lg shadow-[var(--shadow-xs)] overflow-hidden">
        <div class="auth-header">
            <div class="auth-icon">{% icon "lock" %}</div>
            <h1>Reset Password</h1>
            <p class="text-muted">Enter your email and we'll send you a reset link.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group mb-4">
                <label for="id_email">Email Address</label>
                <input type="email" name="email" id="id_email" required autofocus placeholder="your.email@example.com">
            </div>
            <button type="submit" class="btn btn-primary btn-full inline-flex items-center justify-center gap-2 min-h-[38px] py-2 px-4 border border-primary-fill rounded-sm font-body text-sm font-bold leading-[1.2] no-underline cursor-pointer whitespace-nowrap [transition:background_var(--dur-fast)_var(--ease-out),_border-color_var(--dur-fast)_var(--ease-out),_color_var(--dur-fast)_var(--ease-out),_box-shadow_var(--dur-fast)_var(--ease-out)] disabled:opacity-50 disabled:cursor-not-allowed disabled:pointer-events-none [&[aria-disabled='true']]:opacity-50 [&[aria-disabled='true']]:cursor-not-allowed [&[aria-disabled='true']]:pointer-events-none bg-primary-fill text-text-on-accent hover:bg-primary-dark hover:border-primary-dark hover:text-text-on-accent">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            <p><a href="{% url 'accounts:student_login' %}">Back to Student Login</a> | <a href="{% url 'accounts:staff_login' %}">Staff Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
