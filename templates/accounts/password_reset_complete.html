{% extends 'base.html' %}
{% block title %}Password Reset Complete - AI Tutor{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card card animate-in">
        <div class="auth-header">
            <div class="auth-icon">✅</div>
            <h1>Password Reset!</h1>
            <p class="text-muted">Your password has been changed. You can now sign in.</p>
        </div>
        <a href="{% url 'accounts:student_login' %}" class="btn btn-primary btn-full">Sign In as Student</a>
        <div class="auth-footer" style="margin-top:1rem;">
            <p><a href="{% url 'accounts:staff_login' %}">Sign In as Staff</a></p>
        </div>
    </div>
</div>
{% endblock %}
