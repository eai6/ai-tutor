{% extends 'base.html' %}
{% block title %}Reset Password - AI Tutor{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card card animate-in">
        <div class="auth-header">
            <div class="auth-icon">🔑</div>
            <h1>Reset Password</h1>
            <p class="text-muted">Enter your email and we'll send you a reset link.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email">Email Address</label>
                <input type="email" name="email" id="id_email" required autofocus placeholder="your.email@example.com">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            <p><a href="{% url 'accounts:student_login' %}">Back to Student Login</a> | <a href="{% url 'accounts:staff_login' %}">Staff Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
