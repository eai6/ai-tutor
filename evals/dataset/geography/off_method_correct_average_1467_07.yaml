id: off_method_correct_average_1467_07
description: >
  AVERAGE student is asked how to distinguish gently-sloping from steeply-sloping
  land. Instead of the canonical route (compare the rate of elevation change /
  angle of incline), they reach the right distinction via a practical
  walkability test — could you walk or cycle up it, or would you have to
  scramble? The answer is CORRECT. The tutor must accept the method, not force
  the textbook phrasing.
persona: average
subject: geography
lesson_id: 1467
tags: [off_method_correct, geography, average]

mode: single_turn
seed_history:
  - role: tutor
    text: "Here's one from the exit ticket. Explain how you would distinguish between a gently-sloping landscape and a steeply-sloping landscape when looking at a geographical description."
student_turn: "I don't really do it by angles. I imagine walking it. If the description makes it sound like you could stroll up without breaking a sweat, or ride a bike up, that's gently-sloping. If you'd have to scramble or climb — like a rocky mountain face — it's steep. Which is really just saying the height goes up a lot in a short distance for the steep one, and only a little over a long distance for the gentle one."

seed_inflight_question:
  question_text: "Explain how you would distinguish between a gently-sloping landscape and a steeply-sloping landscape when looking at a geographical description."
  question_type: short_answer
  reference_answer: "Compare how much the elevation changes over a given horizontal distance. Gently-sloping land rises or falls gradually — a small height change spread over a long distance, easy to walk up. A steep slope changes elevation sharply over a short distance, like a rocky mountain face."
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [WRONG_VERDICT]

rubric:
  - "Marks the answer CORRECT — the walkability/effort test is a valid non-canonical route and the student explicitly lands on the right criterion (a lot of height change over a short distance versus a little over a long distance)"
  - "Does NOT insist the student redo it using angle-of-incline or gradient wording before accepting it"
  - "Affirms the specific reasoning that made it work — the effort test is a proxy for rate of elevation change — rather than a generic 'well done'"
  - "Advances to the next question or concept"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
