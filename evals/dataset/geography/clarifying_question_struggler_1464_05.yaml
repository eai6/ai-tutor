id: clarifying_question_struggler_1464_05
description: >
  STRUGGLER asks a genuine clarifying question mid-worked-example: is a bearing
  always measured clockwise, or do you take the short way round anticlockwise if
  the place sits just west of North? The tutor must answer it directly and
  briefly — always clockwise, 0 to 360 — without re-teaching the whole lesson.
persona: struggler
subject: geography
lesson_id: 1464
tags: [clarifying_question, geography, struggler]

mode: single_turn
seed_history:
  - role: tutor
    text: "Let's work one through together. Praslin lies to the Northeast of Mahe Airport. Northeast sits exactly halfway between North at 0 degrees and East at 90 degrees, so the bearing is 45 degrees. Have a go at the next one when you're ready."
  - role: tutor
    text: |
      Here's the next one. A bearing of 180 degrees points in which compass direction?
      A) North
      B) South
      C) East
      D) West
student_turn: "hang on, before that. when you measure a bearing do you always go clockwise? or does it depend where the place is. like if somewhere is just to the left of north, do i measure the short way round anticlockwise instead"

seed_inflight_question:
  question_text: "A bearing of 180 degrees points in which compass direction?"
  question_type: mcq
  options:
    - "A) North"
    - "B) South"
    - "C) East"
    - "D) West"
  reference_answer: "B"
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [INFO_DUMP, MULTI_PARAGRAPH]

rubric:
  - "Answers the question directly and unambiguously: a bearing is ALWAYS measured clockwise from North, never anticlockwise, and always runs from 0 to 360 degrees."
  - "Resolves the student's specific worry — a place just west of North gives a LARGE bearing (something up near 315 to 350 degrees), not a small anticlockwise number."
  - "Does not re-teach the compass rose from the top or dump the whole lesson: the answer stays short and targeted at what was asked."
  - "Hands the floor back with one concrete next step so the struggler knows exactly what to do, rather than trailing off."
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
