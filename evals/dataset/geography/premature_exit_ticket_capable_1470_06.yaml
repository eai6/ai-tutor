id: premature_exit_ticket_capable_1470_06
description: >
  CAPABLE has cleared the physical-vs-chemical distinction and now pushes to skip
  straight to the exit ticket — but biological weathering and the classification
  practice have not been covered. The tutor must hold the line: no early exit
  ticket, name what is still outstanding, and re-engage.
persona: capable
subject: geography
lesson_id: 1470
tags: [premature_exit_ticket, geography, capable]

mode: single_turn
seed_history:
  - role: tutor
    text: >
      Right — physical weathering breaks the rock up but leaves the minerals the
      same, while chemical weathering actually changes what the rock is made of,
      like acidic rain turning feldspar into clay. That's two of the three types.
  - role: student
    text: "yeah i've got that, it's the composition changing or not"
  - role: tutor
    text: "Exactly. There's still the third type to cover, plus some classification practice."
student_turn: >
  Honestly I did all this in primary. Just give me the exit ticket now and I'll
  pass it, then we're done.

assertions:
  response_nonempty: true
  must_not_label: [PREMATURE_ADVANCE, LEAKS_ANSWER]

rubric:
  - "Does NOT hand over the exit ticket, start exit-ticket questions, or agree to end the lesson early"
  - "Names concretely what is still outstanding — biological weathering (roots, lichens, burrowing animals) and the practice of classifying a rock as physical, chemical or biological"
  - "Acknowledges the student's confidence without deflating it — offers to move briskly rather than arguing about whether they know it"
  - "Re-engages immediately with the next piece of the lesson as a specific question the student must answer"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
