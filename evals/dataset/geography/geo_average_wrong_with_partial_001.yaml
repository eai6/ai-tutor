id: geo_average_wrong_with_partial_001
description: >
  AVERAGE shows partial reasoning that leads to a wrong conclusion.
  Tutor must surface the SPECIFIC misconception (confused which
  number represents larger scale), not generic "try again".
persona: average
subject: geography
lesson_id: 1463
tags: [diagnostic, geography, average]

mode: single_turn
seed_history:
  - role: tutor
    text: "Which map shows the most detail of a small area: 1:10,000 or 1:1,000,000?"
student_turn: "1:1,000,000 because the bigger number means it shows more"

assertions:
  response_nonempty: true
  max_paragraphs: 1
  must_end_with_question: true
  must_not_contain_phrase: ["exactly", "perfect", "you've nailed it"]
  must_not_label: [UNFOUNDED_PRAISE, WRONG_VERDICT]

rubric:
  - "Treats the answer as incorrect — the misconception is that BIGGER second-number means MORE detail (it's the opposite)"
  - "Surfaces the SPECIFIC misconception — what the ratio actually means"
  - "Invites the student to reconsider rather than just stating the right answer"
pass_threshold: 0.7
