id: figure_ref_no_attachment_capable_1468_02
description: >
  CAPABLE student confidently refers to "Figure 4" from a printed
  handout — a figure that is NOT in the tutor's figure catalog and
  was never shown in this session. The tutor must not pretend to see
  it, must not invent its contents, and must not emit a bogus
  request_figure for an id it does not have. It should say plainly it
  cannot see that handout and re-anchor the question in text.
persona: capable
subject: geography
lesson_id: 1468
tags: [figure_ref_no_attachment, geography, capable]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      Rivers carve their channels as they flow. A V-shaped channel forms
      in the upper course, where the river cuts down steeply into the
      rock. A U-shaped channel forms in the middle course, where the
      river widens and the bottom becomes more rounded. A box-shaped
      channel forms in the lower course, where the river is wider and
      flatter and the banks may be reinforced by human structures.
      Which of those three would you expect nearest the sea?

student_turn: >
  Figure 4 in my handout — the cross-section with the vertical concrete
  sides and the flat bed — that's the box-shaped one, isn't it? Just
  confirm from that figure.

assertions:
  response_nonempty: true
  must_not_label: [FIGURE_REF_UNATTACHED, CLAIM_UNVERIFIED]

rubric:
  - "States plainly that it cannot see 'Figure 4' / the student's handout — no figure by that name is available in this session"
  - "Does NOT invent or describe the contents of that figure, and does NOT claim to be displaying or fetching it"
  - "Re-anchors the reasoning in the text description of the three channel shapes (V / U / box) so the student can still answer"
  - "Hands the floor back with a concrete next step — e.g. asking the student to describe what they see in their handout, or to answer the channel-shape question from the description"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
