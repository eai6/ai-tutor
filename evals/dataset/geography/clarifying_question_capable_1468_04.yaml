id: clarifying_question_capable_1468_04
description: >
  CAPABLE student asks one sharp clarifying question about where the
  depth measurement starts — from the top of the bank, or from the
  water surface. The tutor must answer it directly and concisely
  (depth is measured from the water surface down to the deepest point
  of the riverbed) and hand the floor straight back, NOT re-teach the
  whole channel-shape lesson.
persona: capable
subject: geography
lesson_id: 1468
tags: [clarifying_question, geography, capable]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      To describe the shape and form of a channel we measure two things.
      The width is the distance across the water surface from one bank
      to the other — in this cross-section, 2 metres. The depth is the
      vertical distance from the water surface down to the deepest point
      of the riverbed — here, 1 metre. Have a go at labelling both on
      the cross-section.

student_turn: >
  Quick check before I label it — is the depth measured from the top of
  the bank, or from the water surface?

# The tutor's labelling question is still OPEN — the student asked a clarifying
# question instead of answering it. Without this the engine re-poses.
seed_inflight_question:
  question_text: "The width is the distance across the water surface from one bank to the other — in this cross-section, 2 metres. The depth is the vertical distance from the water surface down to the deepest point of the riverbed — here, 1 metre. Have a go at labelling both on the cross-section."
  question_type: short_answer
  reference_answer: "Width = 2 metres — the distance across the water surface from one bank to the other. Depth = 1 metre — the vertical distance from the water surface down to the deepest point of the riverbed."
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [INFO_DUMP, MULTI_PARAGRAPH]

rubric:
  - "Directly answers the question: depth is measured from the WATER SURFACE down to the deepest point of the riverbed, not from the top of the bank"
  - "Answer is concise — a short direct reply, not a re-teach of V/U/box channel shapes or the whole lesson"
  - "Does not deflect the question back at the student or dodge it with 'what do you think?'"
  - "Returns the student to the labelling task with a clear next step"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
