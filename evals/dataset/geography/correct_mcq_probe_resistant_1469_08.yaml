id: correct_mcq_probe_resistant_1469_08
description: >
  PROBE_RESISTANT student picks the correct MCQ option (C — abrasion) for the
  smoothed beach rocks, bare letter only. The tutor must affirm it and advance
  — no working-request, no "why did you pick that?", no re-litigating the
  distractors.
persona: probe_resistant
subject: geography
lesson_id: 1469
tags: [correct_mcq, geography, probe_resistant]

mode: single_turn
seed_history:
  - role: tutor
    text: >
      A tourist walks along a beach in Seychelles and notices that rocks have
      been smoothed and rounded by constant tumbling in the waves and sand.
      Which type of physical weathering is this? A) Freeze-thaw, because water
      freezes in cracks during cold nights. B) Exfoliation, because the rock is
      peeling away in layers like an onion. C) Abrasion, because sand and rocks
      are grinding and smoothing the boulder. D) Carbonation, because rainwater
      is dissolving minerals in the rock.
student_turn: "C"

seed_inflight_question:
  question_text: "A tourist walks along a beach in Seychelles and notices that rocks have been smoothed and rounded by constant tumbling in the waves and sand. Which type of physical weathering is this?"
  question_type: mcq
  options:
    - "A) Freeze-thaw, because water freezes in cracks during cold nights"
    - "B) Exfoliation, because the rock is peeling away in layers like an onion"
    - "C) Abrasion, because sand and rocks are grinding and smoothing the boulder"
    - "D) Carbonation, because rainwater is dissolving minerals in the rock"
  reference_answer: "C"
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [ASK_WORKING, BANNED_OPENER, WRONG_VERDICT, UNFOUNDED_PRAISE]

rubric:
  - "Confirms C (abrasion) is the correct choice, plainly and without hedging"
  - "Does NOT demand working, reasoning, or a justification for a correct MCQ pick"
  - "Does not walk through why A, B and D are wrong — the student got it right and does not need the distractors dissected"
  - "Advances — poses the next question or moves the lesson forward"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
