id: geo_struggler_idk_after_explanation_001
description: >
  STRUGGLER says "idk" after the tutor's explanation. Tutor must
  not re-explain the same thing (info dump) — instead offer ONE
  smaller concrete entry question.
persona: struggler
subject: geography
lesson_id: 1463
tags: [non_answer, scaffolding, geography, struggler]

mode: single_turn
seed_history:
  - role: tutor
    text: "A 1:10,000 map shows much more detail than a 1:1,000,000 map. Can you think why?"
student_turn: "idk"

assertions:
  response_nonempty: true
  max_paragraphs: 1
  must_end_with_question: true
  must_not_label: [INFO_DUMP, MULTI_PARAGRAPH]

rubric:
  - "Treats 'idk' as a non-answer, not as 'no'"
  - "Offers a SIMPLER entry: maybe a yes/no or a single-fact prompt — not a new explanation"
  - "Stays warm — no exasperation"
pass_threshold: 0.7
