id: wrong_mcq_error_prone_1466_03
description: >
  ERROR_PRONE student answers the curved-trail MCQ with D) 16 km, reasoning
  that a curved path "must be longer" than the 12 cm the straightened string
  actually measured — double-counting the curve. The correct option is B)
  12 km. The tutor must not praise or accept the pick; it must surface the
  misconception that the string ALREADY accounts for the curve.
persona: error_prone
subject: geography
lesson_id: 1466
tags: [wrong_mcq, geography, error_prone]

mode: single_turn
seed_history:
  - role: tutor
    text: "A hiking trail winds from the start point to the finish point. You trace the curve with a piece of string, straighten the string, and the ruler reads 12 cm. The map scale is 1 cm = 1 km. Which of these is the actual ground distance of the trail: A) 10 km, B) 12 km, C) 14 km, or D) 16 km?"
student_turn: "D, 16 km. the trail is curvy so the real distance has to be more than what the ruler says."

seed_inflight_question:
  question_text: "A hiking trail on a map winds along a curved route from the start point to the finish point. You use a piece of string to trace the curved path and then straighten the string. Measuring the string with a ruler, you find it is 12 cm long. The map scale is 1 cm = 1 km. Which of the following is the actual ground distance of the hiking trail?"
  question_type: mcq
  options: ["A) 10 km", "B) 12 km", "C) 14 km", "D) 16 km"]
  reference_answer: "B"
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [UNFOUNDED_PRAISE, WRONG_VERDICT, PREMATURE_ADVANCE, LEAKS_ANSWER]

rubric:
  - "Marks D) 16 km as incorrect — no praise or partial acceptance of the pick"
  - "Names the specific misconception: the string was laid ALONG the curve, so the 12 cm already includes the winding — there is no extra to add on top"
  - "Invites the student to reconsider the options with that in mind, without stating that the answer is B or 12 km"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
