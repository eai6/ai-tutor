id: false_accept_guard_error_prone_1468_05
description: >
  ERROR_PRONE student explains the V-shaped upper-course channel with
  the RIGHT shape but the WRONG process — they credit lateral erosion
  and deposition, when the lesson teaches that vertical erosion
  (downcutting) is what carves the V while sideways erosion is almost
  absent. It reads fluent and hits the keyword "V-shaped", so a lazy
  grader waves it through. The tutor must NOT accept it.
persona: error_prone
subject: geography
lesson_id: 1468
tags: [false_accept_guard, geography, error_prone]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      You've spotted that the upper-course channel is the V-shaped one.
      Now explain the process behind it: how does a V-shaped river
      channel actually develop in the upper course?

student_turn: >
  So in the upper course lateral erosion is strongest, so the river eats
  sideways into the banks near the top and widens them, and then it
  deposits sediment down in the middle of the bed. That makes the sides
  slope inwards to a point, which is why you get the V-shape.

# Simple_tutor needs the in-flight slot to grade against. Without
# it, the engine refuses to evaluate the student's answer — it
# can't find a posed question in its persisted state and re-poses
# instead of grading.
seed_inflight_question:
  question_text: "How does a V-shaped river channel develop in the upper course of a river?"
  question_type: short_answer
  reference_answer: "Vertical erosion (downcutting) dominates in the upper course. The steep gradient gives the fast-flowing water high energy, so it cuts downward into the bedrock rather than sideways. With almost no lateral (sideways) erosion, the channel stays narrow and the steep banks meet at a sharp point at the bottom — a V-shaped cross-section."
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [UNFOUNDED_PRAISE, WRONG_VERDICT]

rubric:
  - "Does NOT accept the explanation as correct just because the student named the right shape (V-shaped) — the process the student gave is wrong"
  - "Points specifically at the error: the student credited LATERAL erosion and deposition, whereas the upper course is dominated by VERTICAL erosion / downcutting with almost no sideways erosion"
  - "Does not hand over the full correct explanation outright — gives a hint or a targeted question that lets the student repair their own reasoning"
  - "Does not praise or affirm the wrong reasoning even though the student sounds confident and fluent"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
