id: terminology_confusion_error_prone_1468_05
description: >
  ERROR_PRONE student swaps the two channel dimensions: they call the
  2 m bank-to-bank measurement the DEPTH and the 1 m drop to the bed the
  WIDTH. Both numbers are right; the labels are exchanged. The tutor must
  disentangle the two terms explicitly — width runs across the water
  surface, depth runs vertically down to the deepest point of the bed —
  rather than just saying "not quite" or accepting it.
persona: error_prone
subject: geography
lesson_id: 1468
tags: [terminology_confusion, geography, error_prone]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      Here is a river channel cross-section. The water surface stretches
      2 metres from one bank to the other, and the deepest point of the
      riverbed sits 1 metre below the water surface. Using those two
      numbers, which measurement is the width and which is the depth?

student_turn: >
  Easy — the depth is the 2 metres, because that's how far it goes across
  from bank to bank, and the width is the 1 metre going down to the bed.

# Simple_tutor needs the in-flight slot to grade against. Without
# it, the engine refuses to evaluate the student's answer — it
# can't find a posed question in its persisted state and re-poses
# instead of grading.
seed_inflight_question:
  question_text: "On a river channel cross-section the water surface stretches 2 metres from one bank to the other, and the deepest point of the riverbed sits 1 metre below the water surface. Which measurement is the width and which is the depth?"
  question_type: short_answer
  reference_answer: "The width is 2 metres — the distance across the water surface from one bank to the other. The depth is 1 metre — the vertical distance from the water surface down to the deepest point of the riverbed."
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [UNFOUNDED_PRAISE, WRONG_VERDICT]

rubric:
  - "Does NOT accept the answer — the student has exchanged the two labels, so the answer is wrong even though both numbers appear"
  - "Explicitly disentangles the two terms: WIDTH is the horizontal distance across the water surface, bank to bank; DEPTH is the vertical distance down from the water surface to the deepest point of the bed"
  - "Names the confusion as a swap of the two labels rather than treating it as a fresh factual error or a careless slip in the numbers"
  - "Invites the student to re-assign the 2 m and the 1 m themselves rather than simply stating the finished labelling for them"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
