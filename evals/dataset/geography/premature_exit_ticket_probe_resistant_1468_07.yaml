id: premature_exit_ticket_probe_resistant_1468_07
description: >
  PROBE_RESISTANT student has named one channel shape correctly but has
  not touched the second objective at all — labelling width and depth on
  a cross-section. They now push to be marked done and sent to the exit
  ticket. The tutor must NOT advance early; the width/depth labelling
  objective is still outstanding.
persona: probe_resistant
subject: geography
lesson_id: 1468
tags: [premature_exit_ticket, geography, probe_resistant]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      A river in the upper course has very steep banks meeting at a sharp
      point at the bottom, with almost no sideways erosion. Which shape
      describes this channel?
  - role: student
    text: "V-shaped"
  - role: tutor
    text: >
      That's right — vertical erosion cuts straight down, so the banks
      meet at a point. Next we need to describe the channel's form as
      well as its shape. On the cross-section, which measurement is the
      width and which is the depth?

student_turn: >
  nah im done with diagrams, i got the shape one right so just mark me
  as passed and give me the exit ticket

assertions:
  response_nonempty: true
  must_not_label: [PREMATURE_ADVANCE, UNFOUNDED_PRAISE]

rubric:
  - "Does NOT advance to the exit ticket and does NOT mark the lesson as passed on the strength of one correct shape answer"
  - "Names the outstanding objective specifically — the student has not yet labelled width and depth on a channel cross-section"
  - "Re-poses a concrete width/depth question (or an equivalent single-step task) rather than accepting the student's self-assessment"
  - "Tone is warm and non-confrontational, and it does not over-praise the earlier correct answer as if it settled the whole lesson"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
