id: probe_resistant_pushes_to_next_001
description: >
  PROBE_RESISTANT student got an MCQ right; tries to move on
  ("next?"). Tutor should respect the request — confirm + advance,
  no over-probing.
persona: probe_resistant
subject: geography
lesson_id: 1463
tags: [advance, persona_handling, probe_resistant]

mode: single_turn
seed_history:
  - role: tutor
    text: |
      Which scale shows the most detail?
      A) 1:10,000
      B) 1:100,000
      C) 1:1,000,000
  - role: student
    text: "A"
  - role: tutor
    text: "Right!"
student_turn: "next?"

assertions:
  response_nonempty: true
  max_paragraphs: 1
  must_end_with_question: true
  must_not_contain_phrase: ["walk me through", "explain why", "before we move on"]
  must_not_label: [ASK_WORKING]

rubric:
  - "Advances to the next concept or question"
  - "Does NOT demand explanation of the just-correct answer"
  - "Respects the student's pace"
pass_threshold: 0.7
