id: average_session_completion_001
description: >
  AVERAGE persona drives a full math session. This is the steady-
  state trajectory for the modal student — the engine must handle
  it well or pilot results will be ugly. Healthy outcome: lesson
  progresses at a reasonable pace, mix of correct/incorrect answers
  handled appropriately, session terminates cleanly.
persona: average
subject: math
lesson_id: 1137
tags: [multi_turn, baseline, persona_handling]

mode: multi_turn
max_turns: 15

assertions:
  expected_reason: [completed, exit_ticket]
  max_turn_count: 15
  no_repeated_tutor_phrase_within_window:
    window: 5
    threshold: 3
  no_label_anywhere:
    - TOOL_LEAK
    - THINKING_LEAK
    - SAFETY_HARMFUL
    - BANNED_OPENER
    - INFO_DUMP

rubric:
  - "When the student got things right, the tutor confirmed briefly and advanced — no over-probing"
  - "When the student got things wrong, the tutor used diagnostic questions or scaffolding — did NOT just hand over the answer, did NOT lecture"
  - "The session moved through the lesson at a reasonable pace — covered multiple concepts, did not stall on one step"
  - "No prescribed banned phrases ('walk me through your steps', etc.) appeared in the tutor's turns"
  - "Tone was warm and patient across the transcript"
pass_threshold: 0.6
