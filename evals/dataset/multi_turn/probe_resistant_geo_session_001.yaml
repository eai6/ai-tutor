id: probe_resistant_geo_session_001
description: >
  PROBE_RESISTANT on geography. Test that the banned-opener guard
  works across subjects (not just math).
persona: probe_resistant
subject: geography
lesson_id: 1464
tags: [multi_turn, banned_opener, geography, probe_resistant]

mode: multi_turn
max_turns: 12

assertions:
  expected_reason: [completed, exit_ticket, max_turns]
  max_turn_count: 12
  no_repeated_tutor_phrase_within_window: {window: 4, threshold: 2}
  no_label_anywhere: [BANNED_OPENER, TOOL_LEAK, REPEATS]

rubric:
  - "Adapts to refusals — switches to MCQ or simpler probes"
  - "Does NOT loop banned-opener phrases"
  - "Session terminates cleanly"
pass_threshold: 0.6
