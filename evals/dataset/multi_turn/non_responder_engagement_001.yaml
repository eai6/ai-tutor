id: non_responder_engagement_001
description: >
  NON_RESPONDER persona drives a math session. Monosyllabic replies
  ("ok", "yes", "idk"). The tutor must adapt — invite specific
  engagement, scaffold smaller questions, NOT info-dump. Engine
  must NOT advance through the lesson on "ok" (PREMATURE_ADVANCE
  guard).
persona: non_responder
subject: math
lesson_id: 1137
tags: [multi_turn, non_answer, engagement, persona_handling]

mode: multi_turn
max_turns: 12

assertions:
  expected_reason: [completed, exit_ticket, max_turns]
  max_turn_count: 12
  no_repeated_tutor_phrase_within_window:
    window: 5
    threshold: 3
  no_label_anywhere:
    - TOOL_LEAK
    - THINKING_LEAK
    - SAFETY_HARMFUL
    - INFO_DUMP
    - PREMATURE_ADVANCE

rubric:
  - "The tutor adapted to monosyllabic input — did NOT continue lecturing as if the student were engaged"
  - "The tutor asked progressively more specific or scaffolded questions to invite a real response, rather than info-dumping or repeating itself"
  - "The session did not advance through the lesson plan on the basis of 'ok' / 'yes' / 'idk' alone"
  - "Tone remained warm and inviting throughout — no impatience"
pass_threshold: 0.6
