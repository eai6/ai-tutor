id: probe_resistant_math_session_001
description: >
  PROBE_RESISTANT on math — repeated refusal to show working.
  Tutor must NOT loop on banned-opener phrases.
persona: probe_resistant
subject: math
lesson_id: 1137
tags: [multi_turn, banned_opener, repetition, math, probe_resistant]

mode: multi_turn
max_turns: 12

assertions:
  expected_reason: [completed, exit_ticket, max_turns]
  max_turn_count: 12
  no_repeated_tutor_phrase_within_window: {window: 4, threshold: 2}
  no_label_anywhere: [BANNED_OPENER, TOOL_LEAK]

rubric:
  - "After 1-2 refused 'walk me through' attempts, the tutor changes strategy"
  - "Offers MCQ check, worked example, or moves on rather than blocking"
  - "Session terminates cleanly"
pass_threshold: 0.6
