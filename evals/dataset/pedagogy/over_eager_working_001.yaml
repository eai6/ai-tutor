id: over_eager_working_001
description: >
  AVERAGE gives a correct bare answer ("B") to the MCQ. Working was
  shown in an earlier turn (so the tutor has evidence the student
  understands the underlying concept). The tutor must ADVANCE — not
  ask for working again. This is the "over_eager_working_request"
  failure category from memory/eval_benchmark_v2_simplified.md.
persona: average
subject: geography
lesson_id: 1463
tags: [over_eager_working_request, advance, pedagogy]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      Quick warm-up: between scale 1:10,000 and scale 1:1,000,000, which
      one is the LARGER scale?
  - role: student
    text: >
      1:10,000 is larger scale because the denominator is smaller, so
      each map unit represents less real-world distance — which means
      more detail per page.
  - role: tutor
    text: >
      Right. Now: a surveyor is creating maps of Seychelles. She
      prepares four maps: Map 1 (1:10,000), Map 2 (1:100,000), Map 3
      (1:500,000), and Map 4 (1:50,000). Which two are LARGE scale?
      A) Map 1 and Map 2
      B) Map 1 and Map 4
      C) Map 3 and Map 4
      D) Map 2 and Map 3

student_turn: "B"

assertions:
  response_nonempty: true
  must_not_contain_phrase:
    - "walk me through your steps"
    - "show me your working"
    - "explain your reasoning"
    - "how did you decide"
  must_not_label: [ASK_WORKING, BANNED_OPENER]

rubric:
  - "Confirms 'B' is correct — briefly, without effusive praise"
  - "Advances the lesson (e.g., introduces a follow-up question, a small extension, or moves to the next concept) rather than asking the student to re-explain working they already demonstrated"
  - "Does NOT ask the student to show working again — the prior turn already established their reasoning"
pass_threshold: 0.7
