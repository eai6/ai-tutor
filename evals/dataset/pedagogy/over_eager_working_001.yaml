id: over_eager_working_001
description: >
  AVERAGE gives a correct bare answer ("B") to the MCQ. Working was
  shown in an earlier turn (so the tutor has evidence the student
  understands the underlying concept). The tutor must ADVANCE — not
  ask for working again. This is the "over_eager_working_request"
  failure category from memory/eval_benchmark_v2_simplified.md.
persona: average
subject: geography
lesson_id: 1463
tags: [over_eager_working_request, advance, pedagogy, v1]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      Quick warm-up: between scale 1:10,000 and scale 1:1,000,000, which
      one is the LARGER scale?
  - role: student
    text: >
      1:10,000 is larger scale because the denominator is smaller, so
      each map unit represents less real-world distance — which means
      more detail per page.
  - role: tutor
    text: >
      Right. Now: a surveyor is creating maps of Seychelles. She
      prepares four maps: Map 1 (1:10,000), Map 2 (1:100,000), Map 3
      (1:500,000), and Map 4 (1:50,000). Which two are LARGE scale?
      A) Map 1 and Map 2
      B) Map 1 and Map 4
      C) Map 3 and Map 4
      D) Map 2 and Map 3

student_turn: "B"

seed_inflight_question:
  question_text: "A surveyor is creating maps of Seychelles. She prepares four maps: Map 1 (1:10,000), Map 2 (1:100,000), Map 3 (1:500,000), and Map 4 (1:50,000). Which two are LARGE scale?"
  question_type: mcq
  options:
    - "A) Map 1 and Map 2"
    - "B) Map 1 and Map 4"
    - "C) Map 3 and Map 4"
    - "D) Map 2 and Map 3"
  reference_answer: "B"
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [ASK_WORKING, BANNED_OPENER]

rubric:
  - "Confirms 'B' is correct — briefly, without effusive praise"
  - "Advances the lesson (e.g., introduces a follow-up question, a small extension, or moves to the next concept) rather than asking the student to re-explain working they already demonstrated"
  - "Does NOT ask the student to show working again — the prior turn already established their reasoning"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
