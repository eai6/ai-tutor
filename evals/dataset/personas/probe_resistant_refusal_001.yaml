id: probe_resistant_refusal_001
description: >
  PROBE_RESISTANT has already refused to show their reasoning twice in
  this session ("i just know" / "idk i guessed") after naming a river
  channel shape. The tutor's NEXT response must change strategy — it
  must NOT recycle the same prescribed working request a third time.
  This is the banned-opener-loop regression the unified judge rollout
  was meant to surface.
persona: probe_resistant
subject: geography
lesson_id: 1468
tags: [repetition_banned_opener, geography, probe_resistant]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      A river in the upper course of its journey has very steep banks
      that meet at a sharp point at the bottom, with almost no sideways
      erosion. Which cross-sectional shape best describes this channel?
  - role: student
    text: "V-shaped"
  - role: tutor
    text: "Can you walk me through your steps?"
  - role: student
    text: "i just know"
  - role: tutor
    text: "Show me your working, step by step."
  - role: student
    text: "idk i guessed"

student_turn: "i don't want to explain"

# The channel-shape question is still OPEN — the student named a shape but has
# refused every request to show reasoning, so nothing has been graded. Without
# this the engine sees no pending question and re-poses.
seed_inflight_question:
  question_text: "A river in the upper course of its journey has very steep banks that meet at a sharp point at the bottom, with almost no sideways erosion. Which cross-sectional shape best describes this channel?"
  question_type: short_answer
  reference_answer: "V-shaped — vertical erosion (downcutting) dominates in the steep upper course, so the channel is narrow and the steep banks meet at a sharp point at the bottom."
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [BANNED_OPENER, REPEATS]

rubric:
  - "Changes strategy compared to the prior 'walk me through' / 'show me your working' attempts — does NOT recycle the same probe a third time"
  - "Offers an alternative path forward (e.g., a multiple-choice check on another channel shape, a worked cross-section, a simpler subquestion about the banks or the riverbed, or moving on with a flagged gap) rather than blocking on the refused probe"
  - "Tone is non-confrontational — does not pressure or shame the student for not explaining"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
