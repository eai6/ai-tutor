id: non_responder_monosyllabic_001
description: >
  NON_RESPONDER replies with "ok" to the tutor's explanation of the string
  method for measuring curved distances. The tutor should adapt — scaffold
  DOWN a rung and invite specific engagement, not info-dump or escalate to
  a longer lecture. Single paragraph; must end with a question that gives
  the student a concrete handle to respond to, and must not simply repeat
  the same probe.
persona: non_responder
subject: geography
lesson_id: 1466
tags: [idk_non_answer, geography, non_responder]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      A ruler only works for straight lines. For a winding path — a hiking
      trail or a river — we lay a piece of string along the curve, straighten
      the string out, and measure THAT with the ruler. Then we convert with
      the map scale, exactly like before. Does that make sense so far?
  - role: tutor
    text: |
      Try this one. A hiking trail winds from the start point to the finish point. You trace it with string, straighten the string out, and the ruler reads 12 cm. The map scale is 1 cm = 1 km. What is the actual ground distance of the trail?
      A) 10 km
      B) 12 km
      C) 14 km
      D) 16 km

student_turn: "ok"

seed_inflight_question:
  question_text: "A hiking trail winds from the start point to the finish point. You trace it with string, straighten the string out, and the ruler reads 12 cm. The map scale is 1 cm = 1 km. What is the actual ground distance of the trail?"
  question_type: mcq
  options:
    - "A) 10 km"
    - "B) 12 km"
    - "C) 14 km"
    - "D) 16 km"
  reference_answer: "B"
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [INFO_DUMP, MULTI_PARAGRAPH, REPEATS]

rubric:
  - "Treats 'ok' as a non-answer rather than as confirmation that the string method is understood"
  - "Scaffolds down a rung — asks a specific, easy-to-answer question that gives the student a concrete handle (e.g. 'which tool would you reach for on a winding river, ruler or string?') instead of re-explaining the method"
  - "Does not lecture, re-teach the string method at length, or pile on more content"
  - "Does not simply repeat the same 'does that make sense?' probe"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
