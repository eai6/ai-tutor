id: struggler_idk_handling_001
description: >
  STRUGGLER responds with "idk this is hard" early in the weathering lesson,
  before any substantive engagement. The tutor must respond supportively, end
  with a question to invite continued engagement, and stay concise (single
  paragraph). It must not info-dump the three weathering types, repeat the same
  opener, or jump to a banned working-request opener on a non-answer input.
persona: struggler
subject: geography
lesson_id: 1469
tags: [non_answer, scaffolding, persona_handling, geography, v1]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      Welcome! Today we're learning about weathering — how Seychelles' granite
      boulders slowly break apart into sand and soil, cracked and crumbled by
      sun, rain, and waves. Have you ever noticed cracks or rough patches on the
      rocks near you?

student_turn: "idk this is hard"

# The tutor's opening question is still OPEN — "idk this is hard" is a non-answer.
# Without this the engine re-poses instead of scaffolding a smaller entry point.
seed_inflight_question:
  question_text: "Have you ever noticed cracks or rough patches on the rocks near you?"
  question_type: short_answer
  reference_answer: "Yes — Seychelles granite commonly shows cracks, rough or flaking patches and crumbling surfaces. That break-up of the rock in place, caused by sun, rain and waves, is weathering."
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [INFO_DUMP, REPEATS, BANNED_OPENER]

rubric:
  - "Acknowledges the student's difficulty without dismissing or judging it"
  - "Offers a concrete, low-stakes entry point into weathering (one small specific question, a single familiar example, or a plain definition) rather than restating the lesson goal or listing all three weathering types"
  - "Tone is warm and patient — no admonishment, no implication the student should already know this"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
