id: no_banned_opener_001
description: >
  STRUGGLER gives a bare incorrect answer ("A") to the MCQ. The tutor
  must not use any of the three prescribed banned phrases — the unified
  judge's BANNED_OPENER rule catches these, and the validator strips
  them defensively, but this scenario guards against engine bypass.
persona: struggler
subject: geography
lesson_id: 1463
tags: [banned_opener, format]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      A surveyor is creating maps of Seychelles. She prepares four maps:
      Map 1 (scale 1:10,000), Map 2 (scale 1:100,000), Map 3 (scale
      1:500,000), and Map 4 (scale 1:50,000). Which two maps are large
      scale maps?
      A) Map 1 and Map 2
      B) Map 1 and Map 4
      C) Map 3 and Map 4
      D) Map 2 and Map 3

student_turn: "A"

# simple_tutor needs the in-flight slot to grade against. Without it, the
# engine refuses to evaluate the student's "A" — it can't find a posed
# question in its persisted state and re-poses instead of grading.
seed_inflight_question:
  question_text: "A surveyor is creating maps of Seychelles. She prepares four maps: Map 1 (scale 1:10,000), Map 2 (scale 1:100,000), Map 3 (scale 1:500,000), and Map 4 (scale 1:50,000). Which two maps are large scale maps?"
  question_type: mcq
  options:
    - "A) Map 1 and Map 2"
    - "B) Map 1 and Map 4"
    - "C) Map 3 and Map 4"
    - "D) Map 2 and Map 3"
  reference_answer: "B"
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_contain_phrase:
    - "walk me through your steps"
    - "show me your working, step by step"
    - "let's check this one together — can you walk me through your steps"
  must_not_label: [BANNED_OPENER]

rubric:
  - "Recognises that 'A' is wrong WITHOUT affirming it"
  - "Asks the student to reconsider, look again, or explain their reasoning — does NOT immediately reveal the correct option"
  - "Keeps the door open for the student to recover their own answer (diagnostic, not didactic)"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
