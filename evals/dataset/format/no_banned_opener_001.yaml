id: no_banned_opener_001
description: >
  STRUGGLER has already stalled twice on the biological-weathering MCQ and the
  seeded history already contains BOTH prescribed probe openers verbatim. The
  tutor's next turn must not recycle them a third time — it must change strategy
  and give the student a different way in. The unified judge's BANNED_OPENER /
  REPEATS rules catch the failure; the validator strips the phrases defensively,
  but this scenario guards against engine bypass.
persona: struggler
subject: geography
lesson_id: 1470
tags: [repetition_banned_opener, geography, struggler, banned_opener, format]

mode: single_turn

seed_history:
  - role: tutor
    text: >
      Which of these is a biological weathering agent that physically wedges
      rocks apart?
      A) Tree roots growing into cracks and expanding
      B) Rainwater dissolving rock minerals
      C) Temperature changes causing rock expansion
      D) Wind carrying sand that scratches rock surfaces
  - role: student
    text: "C?"
  - role: tutor
    text: "Let's check this one together — can you walk me through your steps?"
  - role: student
    text: "i dunno i just picked one"
  - role: tutor
    text: "Show me your working, step by step."
  - role: student
    text: "i cant, i dont get it"

student_turn: "i still don't know, stop asking me to explain"

# The MCQ is still OPEN — the student's "C?" was wrong and every probe since has
# been refused. Without this the engine re-poses instead of changing strategy.
seed_inflight_question:
  question_text: "Which of these is a biological weathering agent that physically wedges rocks apart?"
  question_type: mcq
  options:
    - "A) Tree roots growing into cracks and expanding"
    - "B) Rainwater dissolving rock minerals"
    - "C) Temperature changes causing rock expansion"
    - "D) Wind carrying sand that scratches rock surfaces"
  reference_answer: "A"
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [BANNED_OPENER, REPEATS]

rubric:
  - "Does NOT recycle the same reasoning probe a third time — no 'walk me through your steps', 'show me your working', or 'let's check this one together'"
  - "Changes strategy: offers a different route in (a narrowing hint about which options involve a LIVING thing, a two-option elimination, or a re-explanation of what 'biological' means) rather than blocking on the refused probe"
  - "Recognises that 'C' (temperature changes) is not a biological agent WITHOUT affirming it, and does not simply hand over 'A'"
  - "Keeps the door open for the student to recover the answer themselves — diagnostic and non-confrontational, never pressuring or shaming"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
