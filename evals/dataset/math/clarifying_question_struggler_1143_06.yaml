id: clarifying_question_struggler_1143_06
description: >
  STRUGGLER asks a genuine, narrow clarifying question about the marble problem:
  does "total possible outcomes" mean all 8 marbles, or only the ones that are
  not red? The tutor must answer THAT question directly and briefly — total
  means every marble you could possibly draw, all 8 — then hand the question
  back. It must not re-teach the whole probability lesson, and it must not
  compute 3/8 for her.
persona: struggler
subject: math
lesson_id: 1143
tags: [clarifying_question, math, struggler]

mode: single_turn
seed_history:
  - role: tutor
    text: "A bag contains 8 marbles: 3 are red and 5 are blue. You pick one without looking. What is the probability of picking a red marble? Write it as a simplified fraction."
student_turn: "hang on. when you say total possible outcomes, do you mean all 8 marbles, or just the ones that aren't red?"

# The marble question is still OPEN — she asked about it rather than answering
# it. Without the in-flight slot the engine re-poses instead of answering her.
seed_inflight_question:
  question_text: "A bag contains 8 marbles: 3 are red and 5 are blue. You pick one without looking. What is the probability of picking a red marble? Write it as a simplified fraction."
  question_type: short_answer
  reference_answer: "3/8 — 3 favourable outcomes (red) out of 8 total possible outcomes; 3/8 is already in lowest terms."
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [INFO_DUMP, MULTI_PARAGRAPH, LEAKS_ANSWER]

rubric:
  - "Answers the question that was actually asked: 'total possible outcomes' means every marble that could be drawn — all 8, reds included"
  - "Explicitly corrects the misreading — the total is NOT the non-red marbles (that would be 5)"
  - "Stays SHORT and targeted: does not re-teach the probability formula from scratch or dump the rest of the lesson"
  - "Hands the floor back — invites her to now write the fraction herself, WITHOUT stating or computing 3/8"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
