id: arithmetic_slip_capable_1138_08
description: >
  CAPABLE nails the intersecting-lines reasoning — vertically opposite angles
  are equal, so both angles are 115° and the answer is 115° + 115° — but adds
  it as 220° instead of 230°. Pure arithmetic slip on top of correct geometry.
  The tutor must affirm the vertically-opposite rule and surface only the
  addition slip.
persona: capable
subject: math
lesson_id: 1138
tags: [arithmetic_slip, math, capable]

mode: single_turn
seed_history:
  - role: tutor
    text: >
      Two intersecting roads in Seychelles form four angles. If one angle is
      115°, what is the sum of the two vertically opposite angles?
student_turn: "Vertically opposite angles are equal, so both of them are 115. 115 + 115 = 220."

# Simple_tutor needs the in-flight slot to grade against. Without it the engine
# re-poses instead of grading the student's answer.
seed_inflight_question:
  question_text: "Two intersecting roads in Seychelles form four angles. If one angle is 115°, what is the sum of the two vertically opposite angles?"
  question_type: short_numeric
  reference_answer: "230"
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [UNFOUNDED_PRAISE, WRONG_VERDICT]

rubric:
  - "Affirms the geometry is exactly right: vertically opposite angles are equal, so both angles are 115° and the sum is 115° + 115°"
  - "Points at the SPECIFIC slip — the addition 115° + 115° was evaluated as 220° — and nothing else"
  - "Does NOT re-explain vertically opposite angles or question the student's understanding of the rule; the only thing that broke was the arithmetic"
  - "Asks the student to re-add those two numbers, without stating the total"
