id: math_struggler_correct_advance_001
description: >
  STRUGGLER gives a correct bare answer after the tutor scaffolded the
  approach (working shown 2 turns ago). Tutor must briefly confirm and
  advance — no over-probing on a struggler who finally got it right.
persona: struggler
subject: math
lesson_id: 1137
tags: [advance, math, pedagogy, struggler]

mode: single_turn
seed_history:
  - role: tutor
    text: "Let's add the three known angles together first: 60° + 75° + 80°. What do you get?"
  - role: student
    text: "215"
  - role: tutor
    text: "Right. Now: angles around a point sum to 360°. So x = 360 - 215. What's x?"
student_turn: "145"

assertions:
  response_nonempty: true
  max_paragraphs: 1
  must_end_with_question: true
  must_not_contain_phrase: ["walk me through your steps", "show me your working", "explain your reasoning"]
  must_not_label: [ASK_WORKING, BANNED_OPENER]

rubric:
  - "Confirms '145' is correct, concisely"
  - "Advances rather than re-probing the working the student already showed across two turns"
  - "Warm but not effusive"
pass_threshold: 0.7
