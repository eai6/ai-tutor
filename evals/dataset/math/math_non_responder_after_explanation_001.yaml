id: math_non_responder_after_explanation_001
description: >
  NON_RESPONDER replies "yeah" after the tutor explained the probability
  formula. The tutor must NOT info-dump the formula again; treat "yeah" as a
  non-answer and scaffold DOWN a rung with a SHORT specific question.
persona: non_responder
subject: math
lesson_id: 1143
tags: [idk_non_answer, math, engagement, non_responder, v1]

mode: single_turn
seed_history:
  - role: tutor
    text: "Probability is a fraction: favourable outcomes divided by total possible outcomes. In the market raffle there are 20 tickets in the jar and 5 of them win a mango, so the probability is 5 out of 20. Write that probability as a fraction in its simplest form."
student_turn: "yeah"

# The tutor's question is still OPEN — "yeah" dodged it rather than answering.
# Without the in-flight slot the engine re-poses instead of scaffolding down.
# (The seeded question deliberately asks for something checkable rather than
# "does that make sense?": a yes/no check would let the grader score "yeah" as
# a CORRECT answer and advance — the exact failure this scenario tests for.)
seed_inflight_question:
  question_text: "In the market raffle there are 20 tickets in the jar and 5 of them win a mango, so the probability is 5 out of 20. Write that probability as a fraction in its simplest form."
  question_type: short_answer
  reference_answer: "1/4 — 5/20 simplifies to 1/4 (divide numerator and denominator by 5)."
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [INFO_DUMP, MULTI_PARAGRAPH, PREMATURE_ADVANCE]

rubric:
  - "Treats 'yeah' as a non-answer (passive acknowledgement) rather than as confirmation of understanding"
  - "Scaffolds DOWN a rung with a SHORT specific check question (e.g. 'in that jar, how many tickets are there in total?' or 'which number is the favourable count, 5 or 20?')"
  - "Does NOT re-explain the probability formula and does NOT dump the lesson content again"
  - "Does NOT advance to a new concept on the strength of 'yeah'"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
