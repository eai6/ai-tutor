id: help_request_non_responder_1144_08
description: >
  NON_RESPONDER demands the answer to the restaurant dessert-revenue problem
  outright. The correct answer is 3000 SCR (0.08 x 250 = 20 desserts, 20 x 150
  = 3000). The tutor must scaffold the first stage instead of handing over the
  number, and must not fall back on demanding working from a student who has
  produced none.
persona: non_responder
subject: math
lesson_id: 1144
tags: [help_request, math, non_responder]

mode: single_turn
seed_history:
  - role: tutor
    text: >
      A restaurant in Victoria, Seychelles, serves 250 meals per day. 8% of
      customers order dessert, and desserts sell for 150 SCR each. How much
      revenue does the restaurant expect from dessert sales on a typical day?
student_turn: "just tell me the answer"

# The dessert-revenue question is still OPEN — the student demanded the answer
# instead of giving one. Without the in-flight slot the engine re-poses.
seed_inflight_question:
  question_text: "A restaurant in Victoria, Seychelles, serves 250 meals per day. 8% of customers order dessert, and desserts sell for 150 SCR each. How much revenue does the restaurant expect from dessert sales on a typical day?"
  question_type: short_numeric
  reference_answer: "3000 SCR — 0.08 x 250 = 20 expected dessert orders, and 20 x 150 SCR = 3000 SCR."
  source: inline_authored

assertions:
  response_nonempty: true
  must_not_label: [LEAKS_ANSWER, ASK_WORKING, INFO_DUMP]

rubric:
  - "Does NOT state 3000 SCR, nor the intermediate 20 desserts, nor hand over enough of the chain that only copying is left"
  - "Scaffolds by splitting the problem: gets the student to find the expected number of dessert orders first, before any money is involved"
  - "Does not demand the student show working — they have offered none and are disengaged; the ask must be a small, answerable question"
  - "Holds the line on not giving the answer while staying warm — no scolding about effort or shortcuts"
  # --- BEA-aligned standard rubric (universal across scenarios) ---
  - "If the student made a mistake, the response identifies or recognises it; if the student was correct, the response affirms that clearly without false hedging or unnecessary second-guessing."
  - "If a mistake exists, the response points at its specific location or nature — a particular step, a named misconception, a specific arithmetic slip — not just a generic 'try again' or 'not quite'."
  - "The response does NOT reveal the final answer outright. Partial hints calibrated to the student's level are acceptable; handing over the canonical numeric or letter answer is not."
  - "The response offers correct and relevant guidance — an explanation, elaboration, hint, worked example, or scaffolding — calibrated to the student's apparent level and the current concept."
  - "It is clear from the response what the student should do next — a specific question to answer, an MCQ option to pick, a calculation to perform, or another structured prompt that hands the conversational floor back."
  - "The response is logically consistent with the conversation so far — does not contradict its own prior turns, does not assume facts not yet established, and does not ignore what the student just said."
  - "The tutor's tone is warm and encouraging — supportive without being condescending, honest without being harsh. Never offensive, dismissive, or impatient."
  - "The response sounds natural and conversational, not robotic, templated, or padded with filler openers like 'Great question!', 'Let me think about this carefully', or 'I'm going to explain...'."
pass_threshold: 0.7
